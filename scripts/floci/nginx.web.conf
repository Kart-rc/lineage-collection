server {
  listen 80;
  # Resolve the api service at request time via Docker's embedded DNS so nginx
  # survives api restarts and start-order races.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  location /api { proxy_pass $api_upstream; }
  location /healthz { proxy_pass $api_upstream; }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
